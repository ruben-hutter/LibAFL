[package]
name = "libfuzzer_simple_concolic"
version = "0.15.4"
authors = [
  "Andrea Fioraldi <andreafioraldi@gmail.com>",
  "Dominik Maier <domenukk@gmail.com>",
  "Julius Hohnerlein",
]
edition = "2021"
build = "build.rs"

[features]
default = ["std"]
std = []
# In-process snapshot-based concolic execution over the hybrid QEMU tree
# (qemu-hybrid/). Build with this feature AND the environment from
# snapshot_runner/env.sh (LIBAFL_QEMU_DIR, LLVM_CONFIG_PATH, CC/CXX=clang).
qemu-snapshot = ["dep:libafl_qemu"]

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
debug = true

[dependencies]
libafl = { path = "../../../../crates/libafl", features = [
  "concolic_mutation",
] }
libafl_bolts = { path = "../../../../crates/libafl_bolts" }
libafl_qemu = { path = "../../../../crates/libafl_qemu", features = [
  "usermode",
  "shared",
], optional = true }
libafl_targets = { path = "../../../../crates/libafl_targets", features = [
  "sancov_pcguard_edges",
  "sancov_cmplog",
  "libfuzzer",
] }
clap = { version = "4.5.18", features = ["derive"] }
libc = "0.2"
log = { version = "0.4.22", features = ["release_max_level_info"] }
mimalloc = { version = "0.1.43", default-features = false }

[build-dependencies]
cc = { version = "1.1.22", features = ["parallel"] }
cmake = "0.1.51"
which = "6.0.3"
symcc_libafl = { path = "../../../../crates/libafl_concolic/symcc_libafl" }
symqemu_libafl = { path = "../../../../crates/libafl_concolic/symqemu_libafl" }
