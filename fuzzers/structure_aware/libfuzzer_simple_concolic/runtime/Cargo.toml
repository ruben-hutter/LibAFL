[package]
name = "example_runtime"
version = "0.15.4"
edition = "2021"
authors = ["Julius Hohnerlein <julihoh@users.noreply.github.com>"]

[features]
# Re-export the C++ shim's _sym_* functions from this crate (standalone cdylib
# use). Disable for in-process (rlib) hosts: they link the C++ shim via the
# symcc_runtime crate and the duplicate symbols would clash.
default = ["sym-wrappers"]
sym-wrappers = []

[lib]
# cdylib: loaded by out-of-process SymQEMU (spawned children)
# rlib:   linked into in-process (libafl_qemu hybrid) hosts so that the
#         _rsym_* symbols are exported from the host binary itself
crate-type = ["cdylib", "rlib"]
# this is necessary for SymCC to find the runtime.
name = "SymRuntime"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
# this is somewhat important to ensure the runtime does not unwind into the target program.
panic = "abort"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
log = { version = "0.4.22", features = ["release_max_level_info"] }
symcc_runtime = { path = "../../../../crates/libafl_concolic/symcc_runtime" }
